<!doctype html>
<meta charset="utf-8">
<title>Ironclad 75 rule tests</title>
<style>body{font:15px/1.5 system-ui;margin:20px} .pass{color:green} .fail{color:#c00;font-weight:bold}</style>
<h1>Rule tests</h1>
<pre id="out"></pre>
<script type="module">
// Open http://localhost:8080/tests/ to run. Covers the day counter and reset rules.
import * as C from '../js/challenge.js';
import * as K from '../js/calories.js';
import worker, { runReminder, localNow } from '../worker/reminders.js';

const out = document.getElementById('out');
let failed = 0;
async function test(name, fn) {
  try { await fn(); out.innerHTML += `<span class="pass">✓ ${name}</span>\n`; }
  catch (e) { failed++; out.innerHTML += `<span class="fail">✗ ${name}: ${e.message}</span>\n`; }
}
function eq(a, b) { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error(`expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`); }

const at = (key, hour = 12) => { const d = C.parseKey(key); d.setHours(hour); return d; };
function fullDay() {
  return { workout1: { done: true, outdoor: true }, workout2: { done: true, outdoor: false }, diet: true, alcohol: true, water: 128, reading: { title: 'Book', pages: 10 }, photo: true };
}
function started(startKey) {
  return { ...C.defaultState(), attempt: C.newAttempt(startKey) };
}

test('date math crosses months and DST', () => {
  eq(C.addDays('2026-10-31', 1), '2026-11-01');
  eq(C.daysBetween('2026-10-31', '2026-11-02'), 2);
  eq(C.daysBetween('2026-03-07', '2026-03-09'), 2); // US DST start
  eq(C.dayNumber('2026-10-01', '2026-10-23'), 23);
});

test('empty day has all 7 tasks missing', () => {
  eq(C.missingTasks(undefined).length, 7);
});

test('full day is complete', () => {
  eq(C.isDayComplete(fullDay()), true);
});

test('two indoor workouts are not enough', () => {
  const d = fullDay(); d.workout1.outdoor = false;
  eq(C.missingTasks(d), ['Outdoor workout']);
});

test('outdoor flag on an unfinished workout does not count', () => {
  const d = fullDay(); d.workout1 = { done: false, outdoor: true };
  eq(C.taskState(d).outdoor, false);
});

test('water needs 128 oz, reading needs a title and 10 pages', () => {
  const d = fullDay(); d.water = 112;
  eq(C.missingTasks(d), ['Water']);
  const r = fullDay(); r.reading = { title: '  ', pages: 30 };
  eq(C.missingTasks(r), ['Reading']);
});

test('nothing is evaluated on day 1 itself', () => {
  const s = started('2026-10-31');
  const { event } = C.evaluate(s, at('2026-10-31', 23));
  eq(event, null);
});

test('grace window keeps yesterday open until 3 AM', () => {
  const s = started('2026-10-31');
  eq(C.evaluate(s, at('2026-11-01', 2)).event, null);
  eq(C.evaluate(s, at('2026-11-01', 3)).event?.type, 'reset');
});

test('strict mode (grace 0) resets right after midnight', () => {
  const s = started('2026-10-31'); s.settings.graceHour = 0;
  eq(C.evaluate(s, at('2026-11-01', 0)).event?.type, 'reset');
});

test('missed day resets to Day 1 today and records history', () => {
  const s = started('2026-10-01');
  for (let k = '2026-10-01'; k < '2026-10-23'; k = C.addDays(k, 1)) s.days[k] = fullDay();
  const { state, event } = C.evaluate(s, at('2026-10-25', 9));
  eq(event.failedDay, 23);
  eq(event.daysCompleted, 22);
  eq(state.attempt.startDate, '2026-10-25');
  eq(state.attempts.length, 1);
  eq(state.attempts[0].result, 'reset');
  eq(state.pendingEvent.type, 'reset');
});

test('complete days advance evaluatedThrough without an event', () => {
  const s = started('2026-10-01');
  s.days['2026-10-01'] = fullDay();
  const { state, event } = C.evaluate(s, at('2026-10-02', 12));
  eq(event, null);
  eq(state.attempt.evaluatedThrough, '2026-10-01');
  eq(C.evaluate(state, at('2026-10-02', 13)).state === state, true);
});

test('finishing day 75 completes the challenge', () => {
  const s = started('2026-01-01');
  for (let i = 0; i < 75; i++) s.days[C.addDays('2026-01-01', i)] = fullDay();
  const { state, event } = C.evaluate(s, at(C.addDays('2026-01-01', 76), 12));
  eq(event.type, 'won');
  eq(state.attempt.status, 'completed');
  eq(state.attempts[0].daysCompleted, 75);
});

test('future start date never resets', () => {
  const s = started('2026-11-05');
  eq(C.evaluate(s, at('2026-11-01', 12)).event, null);
});

test('restart with a past date marks earlier days as done off-app', () => {
  const s = C.restart(C.defaultState(), '2026-10-28', at('2026-10-31'));
  eq(s.attempt.startDate, '2026-10-28');
  eq(C.evaluate(s, at('2026-10-31', 12)).event, null);
  eq(C.evaluate(s, at('2026-11-01', 12)).event?.failedDay, 4); // today (day 4) still needs doing
});

test('restart records the abandoned run', () => {
  const s = started('2026-10-20');
  const r = C.restart(s, '2026-10-31', at('2026-10-31'));
  eq(r.attempts[0].result, 'restarted');
  eq(r.attempts[0].daysCompleted, 11);
});

test('calendar statuses for the current run', () => {
  const s = started('2026-10-29');
  s.days['2026-10-29'] = fullDay();
  s.days['2026-10-30'] = fullDay();
  const now = at('2026-10-31', 10);
  eq(C.runDayStatus(s, s.attempt, '2026-10-29', now), 'done');
  eq(C.runDayStatus(s, s.attempt, '2026-10-31', now), 'today');
  eq(C.runDayStatus(s, s.attempt, '2026-11-01', now), 'upcoming');
  eq(C.runDayStatus(s, s.attempt, '2026-10-28', now), 'none');
  eq(C.runDayStatus(s, s.attempt, '2026-10-30', at('2026-10-31', 1)), 'done');
});

test('calendar statuses for a reset run', () => {
  const r = { startDate: '2026-10-01', endDate: '2026-10-05', result: 'reset', daysCompleted: 4, missing: ['Water'] };
  const s = C.defaultState();
  eq(C.runDayStatus(s, r, '2026-10-04', at('2026-10-31')), 'done');
  eq(C.runDayStatus(s, r, '2026-10-05', at('2026-10-31')), 'missed');
  eq(C.runDayStatus(s, r, '2026-10-06', at('2026-10-31')), 'none');
});

test('stats: streaks, attempts, totals, reset causes', () => {
  const s = started('2026-10-29');
  s.attempts = [
    { startDate: '2026-09-01', endDate: '2026-09-11', result: 'reset', daysCompleted: 10, missing: ['Water', 'Reading'] },
    { startDate: '2026-09-20', endDate: '2026-09-23', result: 'reset', daysCompleted: 3, missing: ['Water'] },
  ];
  s.days['2026-10-29'] = fullDay();
  s.days['2026-10-30'] = fullDay();
  s.days['2026-10-31'] = { ...fullDay(), water: 64, reading: { title: 'book', pages: 5 } };
  s.days['2026-09-05'] = { ...fullDay(), reading: { title: 'Other', pages: 20 } };
  const st = C.computeStats(s, at('2026-10-31', 15));
  eq(st.currentStreak, 2);
  eq(st.longestStreak, 10);
  eq(st.attempts, 3);
  eq(st.daysCompleted, 15);
  eq(st.run.waterOz, 128 * 2 + 64);
  eq(st.run.pages, 25);
  eq(st.allTime.pages, 45);
  eq(st.allTime.books, 2);
  eq(st.resetCauses, [['Water', 2], ['Reading', 1]]);
});

const base = { ...K.defaultProfile(), units: 'metric', age: '30', heightCm: '180', weightKg: '80' };

test('Mifflin-St Jeor resting rate (male and female)', () => {
  eq(K.estimate(base).bmr, 1780); // 800 + 1125 - 150 + 5
  eq(K.estimate({ ...base, sex: 'female' }).bmr, 1610); // 1614 rounded to 10
});

test('activity factor and goal adjust the totals', () => {
  const e = K.estimate({ ...base, activity: 'moderate', goal: 'lose1' });
  eq(e.tdee, 2760); // 1780 * 1.55 = 2759
  eq(e.target, 2260);
});

test('targets never drop below the safe minimum', () => {
  const e = K.estimate({ ...base, sex: 'female', age: '70', heightCm: '150', weightKg: '45', activity: 'sedentary', goal: 'lose1' });
  eq(e.target, 1200);
  eq(e.floored, true);
});

test('imperial inputs match metric', () => {
  const imp = { ...K.defaultProfile(), age: '30', heightFt: '5', heightIn: '11', weightLb: '176' };
  const e = K.estimate(imp);
  eq(Math.abs(e.bmr - 1780) <= 10, true);
});

test('incomplete or implausible input gives no estimate', () => {
  eq(K.estimate(K.defaultProfile()), null);
  eq(K.estimate({ ...base, age: '5' }), null);
});

test('unit switch converts entered values', () => {
  const imp = K.convertUnits(base, 'imperial');
  eq([imp.heightFt, imp.heightIn, imp.weightLb], ['5', '11', '176']);
  eq(K.convertUnits(imp, 'metric').heightCm, '180');
});

await test('photos map to their run and day', () => {
  const s = started('2026-10-20');
  s.attempts = [{ startDate: '2026-10-01', endDate: '2026-10-10', result: 'reset', daysCompleted: 9, missing: [] }];
  eq(C.runForKey(s, '2026-10-22').day, 3);
  eq(C.runForKey(s, '2026-10-22').number, 2);
  eq(C.runForKey(s, '2026-10-05').number, 1);
  eq(C.runForKey(s, '2026-10-15'), null);
});

// ---- Reminder Worker, with a fake KV store and push service ----
function mockEnv() {
  const kv = new Map();
  const sent = [];
  return {
    sent,
    KV: { get: async (k, type) => (kv.has(k) ? (type === 'json' ? JSON.parse(kv.get(k)) : kv.get(k)) : null), put: async (k, v) => { kv.set(k, v); } },
    FETCH: async (url, init) => { sent.push({ url, init }); return new Response(null, { status: 201 }); },
  };
}
const post = (env, path, body) => worker.fetch(new Request(`https://w.test${path}`, { method: 'POST', body: JSON.stringify(body) }), env).then(async (r) => ({ status: r.status, data: await r.json() }));
const SUB = { endpoint: 'https://fcm.googleapis.com/fcm/send/abc', keys: { p256dh: 'x', auth: 'y' } };
const pdt = (h, m, day = 31) => Date.UTC(2026, 9, day, h + 7, m); // Oct 2026 is UTC-7

await test('worker: local time follows the phone time zone', () => {
  eq(localNow(pdt(20, 5), 'America/Los_Angeles'), { date: '2026-10-31', time: '20:05' });
});

await test('worker: first phone links, others are refused', async () => {
  const env = mockEnv();
  const first = await post(env, '/subscribe', { subscription: SUB, reminderTime: '20:00', tz: 'America/Los_Angeles' });
  eq(first.status, 200);
  eq((await post(env, '/subscribe', { subscription: SUB })).status, 403);
  eq((await post(env, '/status', { token: 'wrong', status: {} })).status, 403);
  eq((await post(env, '/subscribe', { token: first.data.token, subscription: SUB })).status, 200);
});

await test('worker: one push after reminder time, skipped when done', async () => {
  const env = mockEnv();
  const { data } = await post(env, '/subscribe', { subscription: SUB, reminderTime: '20:00', tz: 'America/Los_Angeles' });
  await post(env, '/status', { token: data.token, status: { date: '2026-10-31', active: true, complete: false, left: 3 } });
  eq(await runReminder(env, pdt(19, 55)), 'waiting');
  eq(await runReminder(env, pdt(20, 5)), 'sent (201)');
  eq(await runReminder(env, pdt(20, 10)), 'waiting'); // already sent today
  eq(env.sent.length, 1);
  await post(env, '/status', { token: data.token, status: { date: '2026-11-01', active: true, complete: true, left: 0 } });
  eq(await runReminder(env, Date.UTC(2026, 10, 2, 4, 5)), 'day complete'); // Nov 1, 8:05 PM PST
  await post(env, '/settings', { token: data.token, enabled: false });
  eq(await runReminder(env, Date.UTC(2026, 10, 3, 4, 5)), 'off');
});

await test('worker: VAPID signature verifies with the public key', async () => {
  const env = mockEnv();
  const { data } = await post(env, '/subscribe', { subscription: SUB, tz: 'UTC' });
  await post(env, '/test', { token: data.token });
  const auth = env.sent[0].init.headers.Authorization;
  const [, jwt, k] = auth.match(/^vapid t=([^,]+), k=(.+)$/);
  const [h, p, sig] = jwt.split('.');
  const bytes = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), (c) => c.charCodeAt(0));
  const key = await crypto.subtle.importKey('raw', bytes(k), { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
  const ok = await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, key, bytes(sig), new TextEncoder().encode(`${h}.${p}`));
  eq(ok, true);
  eq(JSON.parse(new TextDecoder().decode(bytes(p))).aud, 'https://fcm.googleapis.com');
});

out.innerHTML += failed ? `\n<span class="fail">${failed} FAILED</span>` : '\n<span class="pass">ALL PASSED</span>';
document.title = failed ? 'FAILED' : 'PASSED';
</script>
