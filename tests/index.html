const assert = (cond, msg) => { if (!cond) throw new Error(msg); };

const out = document.getElementById('out');
let failed = 0;
async function test(name, fn) {
  try { await fn(); out.innerHTML += `<span class="pass">✓ ${name}</span>\n`; }
  catch (e) { failed++; out.innerHTML += `<span class="fail">✗ ${name}: ${e.message}</span>\n`; }
}
function eq(a, b) { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error(`expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`); }

const at = (key, hour = 12) => { const d = C.parseKey(key); d.setHours(hour); return d; };
function fullDay() {
  return { workout1: { done: true, outdoor: true }, workout2: { done: true, outdoor: false }, diet: true, alcohol: true, water: 128, reading: { title: 'Book', pages: 10 }, photo: true };
}
function started(startKey) {
  return { ...C.defaultState(), attempt: C.newAttempt(startKey) };
}

// ---- Cloud API (Supabase Edge Function), with an in-memory database and fake push ----
function mockEnv(nowIso = '2026-10-31T19:00:00Z') {
  const kv = new Map();
  const days = new Map();
  const sent = [];
  const env = {
    sent, kv, days,
    clock: new Date(nowIso),
    now: () => new Date(env.clock),
    pushResult: { ok: true, status: 200 },
    sendPush: async (token, data) => { sent.push({ token, data }); return env.pushResult; },
    db: {
      getKV: async (k) => structuredClone(kv.get(k) ?? null),
      setKV: async (k, v) => { if (v == null) kv.delete(k); else kv.set(k, structuredClone(v)); },
      upsertDays: async (rows) => rows.forEach((r) => days.set(r.date, structuredClone(r))),
      getDays: async (from, to) => [...days.values()].filter((r) => r.date >= from && r.date <= to).sort((a, b) => (a.date < b.date ? 1 : -1)).map((r) => ({ date: r.date, data: r.data })),
    },
  };
  return env;
}
const BASE = 'https://ref.supabase.co/functions/v1/ironclad';
async function api(env, method, path, { key, secret, body } = {}) {
  const headers = {};
  if (key) headers.Authorization = `Bearer ${key}`;
  if (secret) headers['X-App-Secret'] = secret;
  const raw = body === undefined ? undefined : typeof body === 'string' ? body : JSON.stringify(body);
  const res = await handle(new Request(BASE + path, { method, headers, body: raw }), env);
  return { status: res.status, data: await res.json() };
}
async function linkedEnv() {
  const env = mockEnv();
  const secret = (await api(env, 'POST', '/link', { body: {} })).data.app_secret;
  const key = (await api(env, 'POST', '/api-key/regenerate', { secret })).data.api_key;
  return { env, secret, key };
}
function syncedDay(date, n, overrides = {}) {
  const d = emptyDay(date, n);
  for (const t of Object.values(d.tasks)) { t.done = true; t.done_at = `${date}T15:00:00.000Z`; }
  d.tasks.workout_1.outdoor = true;
  return { ...d, complete: true, outdoor_rule_met: true, ...overrides };
}
const PROGRESS = { start_date: '2026-10-29', status: 'active', total_days_completed: 2, tz: 'America/Los_Angeles' };

await test('api: missing or wrong key gets 401 and no data, on every endpoint', async () => {
  const { env } = await linkedEnv();
  for (const [m, p] of [['GET', '/today'], ['GET', '/summary'], ['GET', '/history?days=7'], ['POST', '/notify'], ['POST', '/device-token'], ['POST', '/sync'], ['POST', '/api-key/regenerate']]) {
    for (const key of [undefined, 'ic75_wrong']) {
      const r = await api(env, m, p, { key, body: m === 'POST' ? { title: 'x', token: 'x'.repeat(30) } : undefined });
      eq(r.status, 401);
      eq(Object.keys(r.data), ['error']);
    }
  }
});

await test('api: link once; regenerate invalidates the old key; revoke blocks access', async () => {
  const { env, secret, key } = await linkedEnv();
  eq((await api(env, 'POST', '/link', { body: {} })).status, 403);
  eq((await api(env, 'GET', '/summary', { key })).status, 200);
  const key2 = (await api(env, 'POST', '/api-key/regenerate', { secret })).data.api_key;
  eq((await api(env, 'GET', '/summary', { key })).status, 401);
  eq((await api(env, 'GET', '/summary', { key: key2 })).status, 200);
  eq((await api(env, 'GET', '/api-key', { secret })).data.active, true);
  await api(env, 'POST', '/api-key/revoke', { secret });
  eq((await api(env, 'GET', '/summary', { key: key2 })).status, 401);
  eq((await api(env, 'GET', '/api-key', { secret })).data.active, false);
  eq([...env.kv.values()].some((v) => JSON.stringify(v).includes(key2)), false); // only hashes are stored
});

  const today = (await api(env, 'GET', '/today', { key })).data; // 12:00 PM in Los Angeles
  eq([today.date, today.day_number, today.complete, today.tasks.water.oz, today.tasks.diet.done], ['2026-10-31', 3, false, 64, true]);

await test('api: /device-token then /notify sends a real push; errors are clear', async () => {
  const { env, key } = await linkedEnv();
  eq((await api(env, 'POST', '/notify', { key, body: { title: 'Hi', body: 'x' } })).status, 409); // no phone yet
  eq((await api(env, 'POST', '/device-token', { key, body: { token: 'short' } })).status, 400);
  eq((await api(env, 'POST', '/device-token', { key, body: { token: 'fcm-token-'.repeat(5), platform: 'android' } })).status, 200);
  eq((await api(env, 'POST', '/notify', { key, body: { body: 'no title' } })).status, 400);
  const ok = await api(env, 'POST', '/notify', { key, body: { title: 'Muse', body: 'Drink some water' } });
  eq([ok.status, ok.data], [200, { ok: true, sent: true }]);
  eq(env.sent[0], { token: 'fcm-token-'.repeat(5), data: { kind: 'message', title: 'Muse', body: 'Drink some water' } });
  env.pushResult = { ok: false, status: 404, error: 'Requested entity was not found.', unregistered: true };
  eq((await api(env, 'POST', '/notify', { key, body: { title: 'Muse' } })).status, 502);
  eq(env.kv.has('device'), false); // dead token dropped
  eq((await api(env, 'POST', '/notify', { key, body: 'not json' })).status, 400);
});

await test('api: evening reminder sends once, only when the day is unfinished', async () => {
  const { env, secret, key } = await linkedEnv();
  await api(env, 'POST', '/device-token', { key, body: { token: 'fcm-token-'.repeat(5) } });
  await api(env, 'POST', '/sync', { secret, body: { progress: PROGRESS, days: [syncedDay('2026-10-31', 3, { complete: false })], reminder: { time: '20:00', enabled: true } } });
  env.clock = new Date('2026-11-01T02:55:00Z'); // 7:55 PM PDT
  eq(await runReminder(env), 'waiting');
  env.clock = new Date('2026-11-01T03:05:00Z'); // 8:05 PM
  eq(await runReminder(env), 'sent');
  eq(env.sent.at(-1).data, { kind: 'reminder' });
  eq(await runReminder(env), 'already sent today');
  // Next day: finished before the reminder, so nothing is sent.
  await api(env, 'POST', '/sync', { secret, body: { progress: PROGRESS, days: [syncedDay('2026-11-01', 4)] } });
  env.clock = new Date('2026-11-02T04:05:00Z'); // Nov 1, 8:05 PM PST
  eq(await runReminder(env), 'day complete');
  await api(env, 'POST', '/sync', { secret, body: { reminder: { time: '20:00', enabled: false } } });
  eq(await runReminder(env), 'off');
  eq((await api(env, 'POST', '/cron')).data.result, 'off'); // public cron route returns no data
  eq(env.sent.length, 1);
});

await test('fcm: service-account sign-in is correctly signed; message is data-only', async () => {
  const pair = await crypto.subtle.generateKey({ name: 'RSASSA-PKCS1-v1_5', modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: 'SHA-256' }, true, ['sign', 'verify']);
  const der = new Uint8Array(await crypto.subtle.exportKey('pkcs8', pair.privateKey));
  const pem = `-----BEGIN PRIVATE KEY-----\n${btoa(String.fromCharCode(...der)).match(/.{1,64}/g).join('\n')}\n-----END PRIVATE KEY-----\n`;
  const account = { project_id: 'ironclad-test', client_email: 'fcm@ironclad-test.iam.gserviceaccount.com', private_key: pem };
  const calls = [];
  const fakeFetch = async (url, init) => {
    calls.push({ url, init });
    if (url.includes('oauth2')) return new Response(JSON.stringify({ access_token: 'ya29.test', expires_in: 3600 }));
    return new Response(JSON.stringify({ name: 'projects/ironclad-test/messages/1' }));
  };
  const res = await sendFcm(JSON.stringify(account), 'device-token', { kind: 'message', title: 'T', body: 'B' }, fakeFetch);
  eq(res.ok, true);
  const assertion = new URLSearchParams(calls[0].init.body).get('assertion');
  const [h, p, sig] = assertion.split('.');
  const bytes = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), (c) => c.charCodeAt(0));
  eq(await crypto.subtle.verify('RSASSA-PKCS1-v1_5', pair.publicKey, bytes(sig), new TextEncoder().encode(`${h}.${p}`)), true);
  eq(JSON.parse(new TextDecoder().decode(bytes(p))).scope, 'https://www.googleapis.com/auth/firebase.messaging');
  eq(calls[1].url, 'https://fcm.googleapis.com/v1/projects/ironclad-test/messages:send');
  eq(calls[1].init.headers.Authorization, 'Bearer ya29.test');
  const msg = JSON.parse(calls[1].init.body).message;
  eq([msg.token, msg.data, 'notification' in msg], ['device-token', { kind: 'message', title: 'T', body: 'B' }, false]);
});

await test('log: bad input, closed days and no run are refused', async () => {
  const { env, key } = await runningEnv();
  const bad = async (body) => (await api(env, 'POST', '/log', { key, body })).status;
  eq(await bad({ tasks: {} }), 400);
  eq(await bad({ tasks: { progress_photo: true } }), 400);
  eq(await bad({ tasks: { pushups: true } }), 400);
  eq(await bad({ tasks: { water: { add_oz: 'lots' } } }), 400);
  eq(await bad({ tasks: { diet: 'yes' } }), 400);
  eq(await bad({ date: '2026-10-29', tasks: { diet: true } }), 400); // two days ago
  eq(await bad({ date: '2026-10-30', tasks: { diet: true } }), 400); // yesterday, but 12 PM: grace closed
  env.clock = new Date('2026-11-01T08:30:00Z'); // 1:30 AM PDT: yesterday still open
  eq(await bad({ date: '2026-10-31', tasks: { diet: true } }), 200);
  eq((await api(env, 'POST', '/log', { body: { tasks: { diet: true } } })).status, 401);
  const fresh = mockEnv();
  const s = (await api(fresh, 'POST', '/link', { body: {} })).data.app_secret;
  eq((await api(fresh, 'POST', '/log', { secret: s, body: { tasks: { diet: true } } })).status, 409); // nothing synced yet
});

await test('log: the phone picks up changes once; its sync keeps them visible', async () => {
  const { env, secret, key } = await runningEnv();
  await api(env, 'POST', '/log', { key, body: { tasks: { water: { add_oz: 16 } } } });

  const changes = (await api(env, 'GET', '/changes', { secret })).data.changes;
  eq([changes.length, changes[0].type, changes[0].date], [1, 'log', '2026-10-31']);
  // The phone syncs its own (older) copy before applying: the logged water must not vanish.
  await api(env, 'POST', '/sync', { secret, body: { progress: PROGRESS, days: [emptyDay('2026-10-31', 3)] } });
  eq((await api(env, 'GET', '/today', { key })).data.tasks.water.oz, 16);
  await api(env, 'POST', '/changes/ack', { secret, body: { ids: changes.map((c) => c.id) } });
  eq((await api(env, 'GET', '/changes', { secret })).data.changes, []);
});

await test('log: phone and server apply 500 random changes identically', () => {
  const r = (() => { let s = 7; return () => ((s = (s * 16807) % 2147483647) / 2147483647); })();
  const pick = (a) => a[Math.floor(r() * a.length)];
  const randomTasks = () => {
    const t = {};
    if (r() < 0.4) t.workout_1 = pick([true, false, { done: true, outdoor: true }, { outdoor: r() < 0.5 }]);
    if (r() < 0.4) t.workout_2 = pick([true, false, { done: true, outdoor: true }, { done: false }]);
    if (r() < 0.3) t.diet = pick([true, false, { done: true }]);
    if (r() < 0.3) t.no_alcohol = pick([true, { done: false }]);
    if (r() < 0.5) t.water = pick([{ add_oz: 16 }, { add_oz: -16 }, { oz: Math.floor(r() * 300) }, { done: true }, { add_oz: 400 }]);
    if (r() < 0.5) t.reading = pick([{ pages: Math.floor(r() * 20) }, { add_pages: 5 }, { done: true }, { title: pick(['', 'Grit']) }, { pages: 3000 }]);
    return Object.keys(t).length ? t : { diet: true };
  };
  for (let i = 0; i < 500; i++) {
    let phone = C.normalizeDay(r() < 0.5 ? undefined : { water: 64, reading: { title: 'Book', pages: 4 }, diet: true });
    const last = pick(['', 'Last Book']);
    let server = C.toApiDay(phone, '2026-10-31', 3);
    for (let n = 0; n < 4; n++) {
      const tasks = randomTasks();
      assert(checkLogTasks(tasks) === null, `generated invalid tasks ${JSON.stringify(tasks)}`);
      C.applyApiTasks(phone, tasks, last);
      server = applyLog(server, tasks, '2026-10-31T12:00:00Z', last || null);
      const p = C.toApiDay(phone, '2026-10-31', 3);
      const strip = (d) => ({ complete: d.complete, outdoor: d.outdoor_rule_met, tasks: Object.fromEntries(Object.entries(d.tasks).map(([k, v]) => [k, { ...v, done_at: undefined }])) });
      eq(strip(p), strip(server));
    }
  }
});
